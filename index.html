<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tri Ân 20/11 · Cô Ngô Thị Linh</title>
    <meta
      name="description"
      content="Trang web chúc mừng ngày Nhà giáo Việt Nam 20/11 gửi tặng cô Ngô Thị Linh với trái tim 3D hạt ánh sáng, lá thư tri ân, bó hoa hồng phấn, album kỷ niệm và pháo hoa cùng 45 học sinh."
    />
    <meta property="og:title" content="Tri Ân 20/11 · Cô Ngô Thị Linh" />
    <meta
      property="og:description"
      content="Lời chúc ngày Nhà giáo Việt Nam 20/11 gửi tặng cô Ngô Thị Linh cùng tập thể 45 học sinh."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-stage="intro">
    <div id="app-shell" class="app-shell">
      <canvas id="heart-canvas" class="bg-canvas" aria-hidden="true"></canvas>
      <canvas id="ambient-glitter-canvas" class="ambient-glitter-canvas hidden" aria-hidden="true"></canvas>
      <canvas id="space-wishes-canvas" class="space-wishes-canvas hidden" aria-hidden="true"></canvas>
      <canvas id="portrait-heart-canvas" class="portrait-heart-canvas hidden" aria-hidden="true"></canvas>
      <div id="portrait-3d-stage" class="portrait-3d-stage hidden"></div>
      <div id="petals-layer" class="petals-layer hidden" aria-hidden="true"></div>
      <canvas id="fireworks-canvas" class="fx-canvas hidden" aria-hidden="true"></canvas>
      <canvas id="finale-floral-canvas" class="fx-floral-canvas hidden" aria-hidden="true"></canvas>

      <header id="top-bar" class="top-bar">
        <button type="button" id="brand-btn" class="brand-btn">
          Cô Ngô Thị Linh · 20/11
        </button>

        <nav class="top-nav" aria-label="Chuyển trang lời chúc">
          <button type="button" class="nav-link" data-nav="intro">Mở đầu</button>
          <button type="button" class="nav-link" data-nav="letter">Lá thư</button>
          <button type="button" class="nav-link" data-nav="bouquet">Bó hoa</button>
          <button type="button" class="nav-link" data-nav="wishes">Lời chúc</button>
          <button type="button" class="nav-link" data-nav="gallery">Album ảnh</button>
          <button type="button" class="nav-link" data-nav="space">Vũ trụ tim</button>
          <button type="button" class="nav-link" data-nav="portrait">Họa ảnh</button>
        </nav>

        <button type="button" id="top-action-btn" class="top-action-btn">
          Trang kết
        </button>
      </header>

      <main id="stage-root" class="stage-root"></main>

      <aside class="vinyl-player" id="vinyl-player" aria-label="Trình phát nhạc tri ân" data-playing="false">
        <audio id="bg-audio" preload="metadata"></audio>

        <div class="vinyl-row">
          <div class="vinyl-wrap">
            <div id="vinyl-disc" class="vinyl-disc">
              <span class="vinyl-groove g1"></span>
              <span class="vinyl-groove g2"></span>
              <span class="vinyl-label"><span class="vinyl-hole"></span></span>
            </div>
            <span id="vinyl-arm" class="vinyl-arm" aria-hidden="true"></span>
          </div>

          <div class="vinyl-info">
            <div class="lyrics-box">
              <p id="lyric-text" class="lyric-text">
                Chạm Nghe nhạc để phát giai điệu 20/11
              </p>
            </div>
            <p id="track-title" class="track-title">Bụi Phấn · Khúc Tri Ân</p>
            <div class="player-controls">
              <button type="button" id="play-toggle-btn" class="btn-play">
                ▶ Nghe nhạc
              </button>
              <button type="button" class="btn-track active" data-track="0">Bài 1</button>
              <button type="button" class="btn-track" data-track="1">Bài 2</button>
              <button type="button" id="upload-mp3-btn" class="btn-upload" title="Chọn file MP3 từ máy">
                ↑
              </button>
              <input type="file" id="mp3-file-input" accept="audio/mp3,audio/*" class="hidden" />
            </div>
          </div>
        </div>
      </aside>
    </div>

    <script type="module" src="/src/portrait3d.ts"></script>
    <script defer src="./script.js"></script>
  </body>
</html>
