<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tri Ân 20/11 — Cô Ngô Thị Linh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="ambient-glow glow-a" aria-hidden="true"></div>
      <div class="ambient-glow glow-b" aria-hidden="true"></div>

      <header class="site-header">
        <div class="brand-wrap">
          <div class="brand-mark" aria-hidden="true">20/11</div>
          <div>
            <p class="brand-kicker">Ngày Nhà Giáo Việt Nam</p>
            <h1 class="brand-title">Tri Ân Cô Ngô Thị Linh</h1>
          </div>
        </div>

        <nav class="top-nav" aria-label="Chuyển trang lời chúc">
          <button type="button" class="nav-link" data-nav="intro">Mở đầu</button>
          <button type="button" class="nav-link" data-nav="letter">Lá thư</button>
          <button type="button" class="nav-link" data-nav="bouquet">Bó hoa</button>
          <button type="button" class="nav-link" data-nav="wishes">Lời chúc</button>
          <button type="button" class="nav-link" data-nav="gallery">Album ảnh</button>
          <button type="button" class="nav-link" data-nav="portrait">Họa ảnh</button>
          <button type="button" class="nav-link" data-nav="space">Vũ trụ tim</button>
        </nav>
      </header>

      <main id="stage-root" class="stage-root" aria-live="polite"></main>

      <aside class="music-dock" aria-label="Trình phát nhạc nền tri ân">
        <button type="button" id="music-toggle-btn" class="music-btn" aria-pressed="false">
          <span class="music-icon" id="music-icon">♪</span>
          <span class="music-label" id="music-label">Bật nhạc nền</span>
        </button>
        <div class="music-meta">
          <span class="music-track-title" id="music-track-title">Bụi Phấn · Giai điệu 20/11</span>
          <span class="music-status" id="music-status">Nhấn để phát nhạc nhẹ nhàng</span>
        </div>
        <div class="music-eq" id="music-eq" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
      </aside>
    </div>

    <div
      id="memory-modal"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-card">
        <button type="button" id="modal-close-btn" class="modal-close" aria-label="Đóng khung ảnh">
          ✕
        </button>
        <div class="modal-img-frame">
          <img id="modal-img" src="" alt="" />
        </div>
        <div class="modal-caption-box">
          <h3 id="modal-title" class="modal-title"></h3>
          <p id="modal-desc" class="modal-desc"></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
